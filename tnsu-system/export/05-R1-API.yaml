components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://sso.example.tnsu.ac.th/realms/tnsu/.well-known/openid-configuration
      description: 'Keycloak realm เดียว (ADR-009). scope ที่ใช้: `adm.applicant` ผู้สมัคร: โปรไฟล์ ใบสมัคร เอกสาร ผล offer ของตนเอง; `adm.guardian` ผู้ปกครอง: ข้อมูลผู้สมัครที่ผูกไว้ (guardian-of); `adm.rounds.read`
        เจ้าหน้าที่: อ่านรอบในขอบเขต OrgUnit; `adm.rounds.write` เจ้าหน้าที่รับสมัคร/module_admin: ตั้งค่ารอบ; `adm.rounds.approve` head/dean/campusvp: อนุมัติรอบ; `adm.applications.read` เจ้าหน้าที่: อ่านใบสมัครในขอบเขต;
        `adm.applications.verify` เจ้าหน้าที่: ตรวจเอกสาร/คุณสมบัติ; `adm.accommodation` dss: พิจารณา accommodation; `adm.schedule.write` เจ้าหน้าที่: ตาราง สนาม กรรมการ slot; `adm.judge` กรรมการ: session
        ที่ได้รับมอบหมาย (judge-of-session); `adm.moderate` ประธาน station/selection_chair: moderation ล็อกผล เปิดแก้; `adm.results.write` เจ้าหน้าที่: คำนวณอันดับ เสนอ override ประกาศผล; `adm.results.approve`
        head/dean/campusvp: อนุมัติผลและ override; `adm.clearing.write` เจ้าหน้าที่: clearing ข้อยกเว้น no-show; `adm.clearing.read` เจ้าหน้าที่/registrar ส่วนกลาง: dashboard (aggregate); `adm.reporting`
        registrar: handoff รายงานตัว; `fin.payments` ผู้สมัคร/ผู้ปกครอง/ผู้ชำระแทน: ใบแจ้งหนี้ QR สถานะ ใบเสร็จ; `fin.staff` finance: reconcile exception คืนเงิน; `fin.approve` finance ผู้อนุมัติตามวงเงิน;
        `hlt.selection` ผู้สมัคร: ส่งแบบคัดกรอง/ใบรับรองแพทย์ (ไปยัง hlt_vault); `hlt.nurse` nurse/physician: คัดกรองหน้าสนาม เหตุบาดเจ็บ (care relationship); `case.appeal.file` ผู้สมัคร: ยื่น/ติดตามคำขอทบทวนผล;
        `case.appeal.decide` admission/judge/head/campusvp: พิจารณาคำขอทบทวน; `priv.consent` เจ้าของข้อมูล/ผู้ปกครอง: consent; `priv.consent.assist` เจ้าหน้าที่: บันทึก consent แบบ assisted; `noti.self`
        ผู้ใช้: inbox ตั้งค่า ผูก LINE; `eng.announce` pr: ร่างประกาศ; `eng.approve` ผู้อนุมัติประกาศ; `rpt.oit` planner/data_owner/rector/pr: OIT; `admin.config` module_admin/checker: 4-eyes config; `admin.ops`
        itadmin/dba_sre: job/integration; `admin.breakglass` itadmin/security_admin/vp: break-glass; `iam.external` head (sponsor)/campus_itadmin: บัญชีบุคคลภายนอก; `adm.assist` admission/helpdesk: assisted
        session; `ana.export` บุคลากร: standard export'
    bankMtls:
      type: mutualTLS
      description: client certificate ของธนาคารคู่สัญญา (I-15) + header X-Signature
    pspSignature:
      type: apiKey
      in: header
      name: X-PSP-Signature
      description: ลายเซ็น webhook ของ PSP (I-54) ตรวจด้วย secret ใน OpenBao
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
      description: UUID ที่ client สร้างก่อนส่ง; key เดิม + payload เดิม = ผลเดิม, key เดิม + payload ต่าง = 422 IDEMPOTENCY-KEY-REUSED; เก็บ 24 ชม. (ADR-022)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag สำหรับ optimistic concurrency
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: cursor จาก nextCursor
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
        - th
        - en
        default: th
    ShareToken:
      name: X-Share-Token
      in: header
      required: false
      schema:
        type: string
      description: token ของลิงก์ชำระแทน (เห็นได้เฉพาะใบแจ้งหนี้นั้น; 04 G10)
    DeviceId:
      name: X-Judge-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: อุปกรณ์ที่ลงทะเบียน MDM (ถูกปฏิเสธเมื่อ revoke)
    BankSignature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
      description: ลายเซ็น/JWS ตามสัญญาธนาคาร
    BotProof:
      name: X-Bot-Proof
      in: header
      required: false
      schema:
        type: string
      description: ผลลัพธ์ proof-of-work แบบ self-hosted (I-55) เมื่อระบบร้องขอ
    StepUp:
      name: X-Step-Up-Token
      in: header
      required: false
      schema:
        type: string
      description: token จากการ re-auth (WebAuthn/OTP) อายุสั้น; ไม่มีหรือหมดอายุ → 403 STEP-UP-REQUIRED
  responses:
    BadRequest:
      description: คำขอไม่ถูกต้อง
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: ต้องเข้าสู่ระบบ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: ไม่มีสิทธิ์ (รวม SoD และ step-up)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: ไม่พบ (หรืออยู่นอกขอบเขต RLS)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: สถานะขัดแย้ง เช่น ยืนยันที่อื่นแล้ว window ปิด
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: ETag ไม่ตรง (If-Match)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: ผิดกติกาธุรกิจ เช่น เกินเพดาน น้ำหนักไม่ครบ 100
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: ต้องส่ง Idempotency-Key / If-Match
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: ถูกจำกัดอัตรา (มี Retry-After)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
          description: วินาที
    Unavailable:
      description: ปิดชั่วคราว/อยู่ใน waiting room
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
