      type: object
      description: RFC 9457 problem details (application/problem+json) พร้อม extension ของ มกช.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          example: https://errors.tnsu.ac.th/adm/confirmed-elsewhere
        title:
          type: string
          description: ข้อความสั้นตาม Accept-Language (ไทยเป็นค่าเริ่มต้น)
          example: คุณยืนยันสิทธิ์ที่อื่นแล้ว
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: สละสิทธิ์เดิมก่อนสมัครรอบนี้ (เหลือสิทธิ์สละ 1 ครั้ง)
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: รหัสเสถียรสำหรับ client เช่น ADM-CONFIRMED-ELSEWHERE, ADM-SEAT-CAP-EXCEEDED, SOD-MAKER-CHECKER, IDEMPOTENCY-KEY-REUSED
          example: ADM-CONFIRMED-ELSEWHERE
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
                description: JSON Pointer ของฟิลด์
              code:
                type: string
              message:
                type: string
        retryAfterSeconds:
          type:
          - integer
          - 'null'
