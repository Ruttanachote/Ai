      - $ref: '#/components/parameters/Limit'
      security: []
      description: ให้บริการผ่าน CDN ได้ (Cache-Control public, stale-if-error)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundSummaryPage'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
