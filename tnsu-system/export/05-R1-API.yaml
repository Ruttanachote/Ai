# TNSU R1 "รับสมัคร" — OpenAPI 3.1 (สร้างจากข้อมูลชุดเดียวกับ r1-requirements.md; ห้ามแก้ ID ให้ขัดกับ r1-traceability.md)
openapi: 3.1.0
info:
  title: TNSU R1 รับสมัคร API
  version: 1.0.0-r1-draft
  summary: API สาธารณะและ back-office ของ Release R1 "รับสมัคร" (ADM + IAM/ORG/NOTI/ENG/SVC/CASE/DOC/PRIV/FIN/HLT/FAC/RPT/ADMIN ส่วน R1)
  description: 'ออกแบบตาม ADR-022 (เล่ม 07): REST resource-oriented, path `/api/v1`, error แบบ RFC 9457 (`application/problem+json`), cursor pagination, `Idempotency-Key` บังคับกับ POST ที่มีผลทางการเงิน/ที่นั่ง,
    ETag + If-Match สำหรับการแก้ไข config, OIDC (Keycloak; ThaID ผ่าน identity brokering) พร้อม scope ตามบทบาท และ ABAC/RLS ที่ server (scope ใน token ไม่พอ — ทุกคำขอถูกตรวจ OrgUnit/relationship). ข้อความ
    error ภาษาไทยเป็นค่าเริ่มต้น (Accept-Language). วันที่เป็น ISO-8601 (ค.ศ., UTC) และ client แสดง พ.ศ. ไม่มีเลขประจำตัวประชาชนใน URL/query/response (ใช้ค่า mask). `x-fr` อ้าง FR ใน docs/r1/r1-requirements.md.
    ค่าที่ติด [ต้องตรวจสอบ] ในเอกสารยังเป็นสมมติฐาน (A-xx/Q-xx).'
  license:
    name: Proprietary — มหาวิทยาลัยการกีฬาแห่งชาติ [ต้องตรวจสอบ]
    identifier: LicenseRef-TNSU
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: api.example.tnsu.ac.th
      description: '[ต้องตรวจสอบ] โดเมนจริง'
security:
- oidc: []
tags:
- name: Public
- name: Applicant
- name: Applications
- name: Documents
- name: Accommodation
- name: Verification
- name: Payments
- name: Payment callbacks
- name: Finance
- name: Rounds
- name: Schedules
- name: Medical clearance
- name: Scores
- name: Results
- name: Confirmations
- name: Clearing
- name: Appeals
- name: Guardian consent
- name: Handoff
- name: Notifications
- name: Announcements
- name: OIT
- name: Admin
